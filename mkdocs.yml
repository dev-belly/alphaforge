site_name: AlphaForge
site_description: Reproducible factor research, portfolio construction, and backtesting in Python
site_url: https://dev-belly.github.io/alphaforge/
repo_url: https://github.com/dev-belly/alphaforge
repo_name: dev-belly/alphaforge
edit_uri: edit/main/docs/
exclude_docs: |
  FINAL_ENGINEERING_REPORT.md
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Reproduce the sample: sample-run.md
  - Validation & limitations: validation.md
  - Architecture: architecture.md
  - Quickstart: quickstart.md
  - Modules:
      - Risk (Regime & Stress): modules/risk.md
      - API: modules/api.md
      - Data & Quality: modules/data.md
      - Factor Research: modules/factor_research.md
      - Portfolio Optimization: modules/portfolio_optimization.md
      - Backtesting: modules/backtesting.md
      - Research Copilot: modules/ai_agent.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid.js
extra_css:
  - stylesheets/extra.css
