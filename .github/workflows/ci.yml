name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dashboard,viz,dev]"

      - name: Lint
        run: |
          ruff check src apps tests scripts
          ruff format --check src apps tests scripts

      - name: Type-check
        run: mypy src apps/api

      - name: Docs integrity (mkdocs nav resolves)
        run: python scripts/check_docs.py

      - name: Independently verify the saved real-market comparison
        run: python scripts/verify_comparison.py docs/experiments/real-sp500

      - name: Unit & regression tests (fast)
        run: pytest -m "not slow"

  integration:
    name: Integration (slow pipeline + API)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dashboard,viz,dev]"
      - name: Full suite (incl. slow)
        run: pytest --cov=alphaforge --cov=apps --cov-report=term-missing
