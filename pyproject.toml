[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Institutional Quant Research & Portfolio Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlphaForge Contributors" }]
keywords = [
    "quantitative-finance",
    "factor-investing",
    "portfolio-optimization",
    "risk-model",
    "backtesting",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "cvxpy>=1.4",
    "duckdb>=0.9",
    "pyarrow>=13.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "pydantic>=2.4",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "httpx>=0.25"]
dashboard = ["streamlit>=1.28", "plotly>=5.17", "httpx>=0.25"]
viz = ["matplotlib>=3.7", "plotly>=5.17"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.6",
    "black>=23.11",
    "mypy>=1.7",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/dev-belly/AlphaForge"
Repository = "https://github.com/dev-belly/AlphaForge"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.setuptools.package-data]
alphaforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: marks tests as slow", "integration: integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "B008", "N803", "N806", "SIM108", "B905"]
exclude = ["*.ipynb", "data", "build", "dist"]

[tool.ruff.lint.isort]
known-first-party = ["alphaforge"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/", "apps/dashboard/"]
